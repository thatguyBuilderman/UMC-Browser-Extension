name: Attach extension zip to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: zip -r meeland-extension.zip manifest.json assets content styles userscripts

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" meeland-extension.zip --clobber
